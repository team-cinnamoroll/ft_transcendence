services:
  dev-container:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
      - workspace_node_modules:/workspace/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.claude:/home/node/.claude:cached
    working_dir: /workspace
    command: sleep infinity
    extra_hosts:
      - 'tracen.local:127.0.0.1'
      - 'registry.tracen.local:127.0.0.1'

  ci-docker:
    image: docker:27-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ''
    volumes:
      - ci_docker_data:/var/lib/docker
      - .:/workspace:cached
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        if [ -f /workspace/containers/infra/local-prod/certs/ca.crt ]; then
          mkdir -p /etc/docker/certs.d/registry.tracen.local:5000
          cp /workspace/containers/infra/local-prod/certs/ca.crt /etc/docker/certs.d/registry.tracen.local:5000/ca.crt
        fi
        exec dockerd-entrypoint.sh --host=tcp://0.0.0.0:2375 --host=unix:///var/run/docker.sock
    extra_hosts:
      - 'tracen.local:127.0.0.1'
      - 'registry.tracen.local:127.0.0.1'
    healthcheck:
      test: ['CMD-SHELL', 'docker info >/dev/null 2>&1']
      interval: 2s
      timeout: 5s
      retries: 30

  frontend:
    image: mcr.microsoft.com/devcontainers/javascript-node:24
    env_file:
      - .env.dev
    volumes:
      - .:/workspace:cached
      - workspace_node_modules:/workspace/node_modules
    working_dir: /workspace
    command: sh -lc "corepack enable && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 pnpm --filter @tracen/frontend-bff exec next dev --hostname 0.0.0.0 --port 3000"
    depends_on:
      - backend
    ports:
      - '3000:3000'

  backend:
    image: mcr.microsoft.com/devcontainers/javascript-node:24
    env_file:
      - .env.dev
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-tracen_secret}@redis:6379
    volumes:
      - .:/workspace:cached
      - workspace_node_modules:/workspace/node_modules
      - file_storage_data:${FILE_STORAGE_BASE_DIR:-/app/uploads}
    working_dir: /workspace
    command: sh -lc "corepack enable && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 pnpm --filter @tracen/backend exec vite --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8000:8000'

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - '8080:80'
    volumes:
      - ./containers/infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: postgres:17-alpine
    env_file:
      - .env.dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./containers/infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.8-alpine
    env_file:
      - .env.dev
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD:-tracen_secret}"
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD:-tracen_secret}" ping >/dev/null
      interval: 2s
      timeout: 3s
      retries: 30

  # ── 可視化基盤 (analytics profile) ─────────────────────────────
  # ES は重いため既定の `up` では起動しない。可視化を触るときのみ profile 指定で起動する:
  #   docker compose -f docker-compose.dev.yml --profile analytics up -d elasticsearch kibana
  # Kibana UI: http://localhost:5601 / Elasticsearch: http://localhost:9200
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: ['analytics']
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - '9200:9200'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 40

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: ['analytics']
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=true
      - SERVER_PUBLICBASEURL=http://localhost:8080/kibana
    ports:
      - '5601:5601'
    depends_on:
      elasticsearch:
        condition: service_healthy

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    profiles: ['analytics']
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - '8081:8080'
    volumes:
      - ./containers/infra/analytics/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./containers/infra/analytics/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  workspace_node_modules:
  postgres_data:
  ci_docker_data:
  redis_data:
  file_storage_data:
  elasticsearch_data:
