services:
  dev-container:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    entrypoint: []
    user: root
    volumes:
      - .:/workspace:cached
      - tracen-root-node-modules:/workspace/node_modules
      - tracen-contracts-node-modules:/workspace/containers/apps/contracts/node_modules
      - tracen-backend-node-modules:/workspace/containers/apps/backend/node_modules
      - tracen-frontend-bff-node-modules:/workspace/containers/apps/frontend-bff/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.claude:/home/node/.claude:cached
    working_dir: /workspace
    command:
      - sh
      - -lc
      - bash .devcontainer/scripts/dev-container-bootstrap.sh && exec sleep infinity
    extra_hosts:
      - 'tracen.local:127.0.0.1'
      - 'registry.tracen.local:127.0.0.1'

  ci-docker:
    image: docker:27-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ''
    volumes:
      - ci_docker_data:/var/lib/docker
      - .:/workspace:cached
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        if [ -f /workspace/containers/infra/local-prod/certs/ca.crt ]; then
          mkdir -p /etc/docker/certs.d/registry.tracen.local:5000
          cp /workspace/containers/infra/local-prod/certs/ca.crt /etc/docker/certs.d/registry.tracen.local:5000/ca.crt
        fi
        exec dockerd-entrypoint.sh --host=tcp://0.0.0.0:2375 --host=unix:///var/run/docker.sock
    extra_hosts:
      - 'tracen.local:127.0.0.1'
      - 'registry.tracen.local:127.0.0.1'
    healthcheck:
      test: ['CMD-SHELL', 'docker info >/dev/null 2>&1']
      interval: 2s
      timeout: 5s
      retries: 30

  frontend:
    image: mcr.microsoft.com/devcontainers/javascript-node:24
    env_file:
      - .env.dev
    volumes:
      - .:/workspace:cached
      - tracen-root-node-modules:/workspace/node_modules
      - tracen-contracts-node-modules:/workspace/containers/apps/contracts/node_modules
      - tracen-frontend-bff-node-modules:/workspace/containers/apps/frontend-bff/node_modules
    working_dir: /workspace
    command: sh -lc "COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm --filter @tracen/frontend-bff exec next dev --hostname 0.0.0.0 --port 3000"
    depends_on:
      - backend
    ports:
      - '3000:3000'

  backend:
    image: mcr.microsoft.com/devcontainers/javascript-node:24
    labels:
      analytics_source: 'true'
    env_file:
      - .env.dev
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-tracen_secret}@redis:6379
    volumes:
      - .:/workspace:cached
      - tracen-root-node-modules:/workspace/node_modules
      - tracen-contracts-node-modules:/workspace/containers/apps/contracts/node_modules
      - tracen-backend-node-modules:/workspace/containers/apps/backend/node_modules
      - file_storage_data:${FILE_STORAGE_BASE_DIR:-/app/uploads}
    working_dir: /workspace
    command: sh -lc "COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm --filter @tracen/backend exec vite --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8000:8000'

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - '8080:80'
    volumes:
      - ./containers/infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: postgres:17-alpine
    env_file:
      - .env.dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./containers/infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.8-alpine
    env_file:
      - .env.dev
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD:-tracen_secret}"
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD:-tracen_secret}" ping >/dev/null
      interval: 2s
      timeout: 3s
      retries: 30

  # ── 可視化基盤 (analytics profile) ─────────────────────────────
  # ES は重いため既定の `up` では起動しない。可視化を触るときのみ profile 指定で起動する:
  #   docker compose -f docker-compose.dev.yml --profile analytics up -d elasticsearch kibana
  # Kibana UI: http://localhost:5601 / Elasticsearch: http://localhost:9200
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    env_file:
      - .env.dev
    profiles: ['analytics']
    ports:
      - '9200:9200'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 40

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    env_file:
      - .env.dev
    profiles: ['analytics']
    ports:
      - '5601:5601'
    depends_on:
      elasticsearch:
        condition: service_healthy

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    profiles: ['analytics']
    env_file:
      - .env.dev
    volumes:
      - ./containers/infra/analytics/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./containers/infra/analytics/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./containers/infra/analytics/logstash/templates:/usr/share/logstash/templates:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    profiles: ['analytics']
    user: root
    command: ['filebeat', '-e', '--strict.perms=false']
    volumes:
      - ./containers/infra/analytics/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - logstash

  mock-producer:
    image: python:3.12-alpine
    profiles: ['analytics']
    labels:
      analytics_source: 'true'
    command: ['python', '/app/produce.py']
    volumes:
      - ./containers/infra/analytics/mock-producer/produce.py:/app/produce.py:ro

  # ── モニタリング基盤 (Prometheus + Grafana + Alertmanager) ─────────────────────────────
  # メトリクス監視基盤。dev では通常の `up` に含めて起動する(profile 指定は不要)。
  #   docker compose -f docker-compose.dev.yml up -d
  # Grafana UI: http://localhost:3001 / Prometheus: http://localhost:9090 / Alertmanager: http://localhost:9093
  prometheus:
    image: prom/prometheus:v3.13.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./containers/infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./containers/infra/monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:13.1.1
    env_file:
      - .env.dev
    environment:
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./containers/infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./containers/infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3001:3000'
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.0
    volumes:
      - ./containers/infra/monitoring/alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - ./containers/infra/monitoring/alertmanager/secret:/etc/alertmanager/secret:ro
    command:
      - '--config.file=/etc/alertmanager/config.yml'
    ports:
      - '9093:9093'

  # ── Exporters ─────────────────────────────
  # 各サービスのメトリクスを Prometheus が読める /metrics 形式で公開する。
  # ホストの CPU/メモリ/ディスク/ネットワーク
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - '/:/host:ro,rslave'

  # コンテナ単位のリソース使用量(どのコンテナが CPU/メモリを食っているか)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  # PostgreSQL のコネクション数/クエリ/DB サイズ等
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-tracen}:${POSTGRES_PASSWORD:-tracen}@db:5432/${POSTGRES_DB:-tracen}?sslmode=disable
    depends_on:
      - db

  # Redis のメモリ使用量/接続数/ヒット率等
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-tracen_secret}
    depends_on:
      - redis

  # Nginx のアクティブ接続数/リクエスト数
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command:
      - '--nginx.scrape-uri=http://nginx:80/stub_status'
    depends_on:
      - nginx

volumes:
  tracen-root-node-modules:
  tracen-contracts-node-modules:
  tracen-backend-node-modules:
  tracen-frontend-bff-node-modules:
  postgres_data:
  ci_docker_data:
  redis_data:
  file_storage_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
  alertmanager_secret:
