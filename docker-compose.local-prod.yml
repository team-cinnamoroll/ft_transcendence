services:
  registry:
    image: registry:2
    ports:
      - '5000:5000'
    environment:
      REGISTRY_HTTP_ADDR: ${REGISTRY_HTTP_ADDR}
      REGISTRY_HTTP_TLS_CERTIFICATE: ${REGISTRY_HTTP_TLS_CERTIFICATE}
      REGISTRY_HTTP_TLS_KEY: ${REGISTRY_HTTP_TLS_KEY}
    volumes:
      - registry_data:/var/lib/registry
      - ./containers/infra/local-prod/certs/tls.crt:/etc/registry/tls/tls.crt:ro
      - ./containers/infra/local-prod/certs/tls.key:/etc/registry/tls/tls.key:ro

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./containers/infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      local-prod:
        aliases:
          - db

  redis:
    image: redis:8.8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping >/dev/null']
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      local-prod:
        aliases:
          - redis

  backend:
    image: registry.tracen.local:5000/tracen-backend:${TRACEN_IMAGE_TAG:-local}
    labels:
      analytics_source: 'true'
    build:
      context: .
      dockerfile: containers/apps/backend/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${BACKEND_PORT}
      TLS_CERT_PATH: ${BACKEND_TLS_CERT_PATH}
      TLS_KEY_PATH: ${BACKEND_TLS_KEY_PATH}
      DATABASE_URL: ${DATABASE_URL}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS}
      PEPPER: ${PEPPER}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN}
      FILE_STORAGE_BASE_DIR: ${FILE_STORAGE_BASE_DIR}
      JWT_ISSUER: ${JWT_ISSUER}
    volumes:
      - ./containers/infra/local-prod/certs/tls.crt:/etc/tracen/certs/tls.crt:ro
      - ./containers/infra/local-prod/certs/tls.key:/etc/tracen/certs/tls.key:ro
      - ./jwt-certs:/jwt-certs:ro
      - file_storage_data:${FILE_STORAGE_BASE_DIR:-/app/uploads}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      local-prod:
        aliases:
          - backend.tracen.local

  frontend:
    image: registry.tracen.local:5000/tracen-frontend-bff:${TRACEN_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: containers/apps/frontend-bff/Dockerfile
      args:
        NEXT_PUBLIC_BFF_API_BASE_URL: ${NEXT_PUBLIC_BFF_API_BASE_URL}
        APP_API_BASE_URL: ${APP_API_BASE_URL}
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${FRONTEND_PORT}
      TLS_CERT_PATH: ${FRONTEND_TLS_CERT_PATH}
      TLS_KEY_PATH: ${FRONTEND_TLS_KEY_PATH}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS}
      APP_API_BASE_URL: ${APP_API_BASE_URL}
      NEXT_PUBLIC_BFF_API_BASE_URL: ${NEXT_PUBLIC_BFF_API_BASE_URL}
    volumes:
      - ./containers/infra/local-prod/certs/tls.crt:/etc/tracen/certs/tls.crt:ro
      - ./containers/infra/local-prod/certs/tls.key:/etc/tracen/certs/tls.key:ro
      - ./containers/infra/local-prod/certs/ca.crt:/etc/tracen/certs/ca.crt:ro
    depends_on:
      - backend
    networks:
      local-prod:
        aliases:
          - frontend.tracen.local

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - '443:443'
    volumes:
      - ./containers/infra/nginx/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./containers/infra/local-prod/certs/tls.crt:/etc/nginx/certs/tls.crt:ro
      - ./containers/infra/local-prod/certs/tls.key:/etc/nginx/certs/tls.key:ro
      - ./containers/infra/local-prod/certs/ca.crt:/etc/nginx/certs/ca.crt:ro
    networks:
      local-prod:
        aliases:
          - tracen.local

  # ── 可視化基盤 (ELK, security 有効, analytics profile) ─────────────
  # ES/Logstash は外部公開せず、Kibana のみ Nginx 経由(/kibana, 要ログイン)で公開する。
  #   docker compose -f docker-compose.local-prod.yml --profile analytics up -d
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: ['analytics']
    env_file:
      - .env.local-prod
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:9200 >/dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 40
    networks:
      local-prod:
        aliases:
          - elasticsearch

  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: ['analytics']
    env_file:
      - .env.local-prod
    entrypoint: ['bash', '-c']
    command:
      - |
        until curl -s -u "elastic:$${ELASTIC_PASSWORD}" http://elasticsearch:9200 >/dev/null; do sleep 2; done
        curl -s -X POST -u "elastic:$${ELASTIC_PASSWORD}" \
          http://elasticsearch:9200/_security/user/kibana_system/_password \
          -H 'Content-Type: application/json' \
          -d "{\"password\":\"$${KIBANA_SYSTEM_PASSWORD}\"}"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      local-prod:
        aliases:
          - es-setup

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: ['analytics']
    env_file:
      - .env.local-prod
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-setup:
        condition: service_completed_successfully
    networks:
      local-prod:
        aliases:
          - kibana

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    profiles: ['analytics']
    env_file:
      - .env.local-prod
    volumes:
      - ./containers/infra/analytics/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./containers/infra/analytics/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./containers/infra/analytics/logstash/templates:/usr/share/logstash/templates:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      local-prod:
        aliases:
          - logstash

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    profiles: ['analytics']
    user: root
    command: ['filebeat', '-e', '--strict.perms=false']
    volumes:
      - ./containers/infra/analytics/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - logstash
    networks:
      local-prod:
        aliases:
          - filebeat

networks:
  local-prod:

volumes:
  registry_data:
  postgres_data:
  redis_data:
  file_storage_data:
  elasticsearch_data:
