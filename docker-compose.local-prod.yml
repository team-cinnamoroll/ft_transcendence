services:
  registry:
    image: registry:2
    ports:
      - '5000:5000'
    environment:
      REGISTRY_HTTP_ADDR: ${REGISTRY_HTTP_ADDR}
      REGISTRY_HTTP_TLS_CERTIFICATE: ${REGISTRY_HTTP_TLS_CERTIFICATE}
      REGISTRY_HTTP_TLS_KEY: ${REGISTRY_HTTP_TLS_KEY}
    volumes:
      - registry_data:/var/lib/registry
      - ./containers/infra/local-prod/certs/tls.crt:/etc/registry/tls/tls.crt:ro
      - ./containers/infra/local-prod/certs/tls.key:/etc/registry/tls/tls.key:ro

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./containers/infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      local-prod:
        aliases:
          - db

  redis:
    image: redis:8.8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping >/dev/null']
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      local-prod:
        aliases:
          - redis

  backend:
    image: registry.tracen.local:5000/tracen-backend:${TRACEN_IMAGE_TAG:-local}
    labels:
      analytics_source: 'true'
    build:
      context: .
      dockerfile: containers/apps/backend/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${BACKEND_PORT}
      TLS_CERT_PATH: ${BACKEND_TLS_CERT_PATH}
      TLS_KEY_PATH: ${BACKEND_TLS_KEY_PATH}
      DATABASE_URL: ${DATABASE_URL}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS}
      PEPPER: ${PEPPER}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN}
      FILE_STORAGE_BASE_DIR: ${FILE_STORAGE_BASE_DIR}
      JWT_ISSUER: ${JWT_ISSUER}
    volumes:
      - ./containers/infra/local-prod/certs/tls.crt:/etc/tracen/certs/tls.crt:ro
      - ./containers/infra/local-prod/certs/tls.key:/etc/tracen/certs/tls.key:ro
      - ./jwt-certs:/jwt-certs:ro
      - file_storage_data:${FILE_STORAGE_BASE_DIR:-/app/uploads}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      local-prod:
        aliases:
          - backend.tracen.local

  frontend:
    image: registry.tracen.local:5000/tracen-frontend-bff:${TRACEN_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: containers/apps/frontend-bff/Dockerfile
      args:
        NEXT_PUBLIC_BFF_API_BASE_URL: ${NEXT_PUBLIC_BFF_API_BASE_URL}
        APP_API_BASE_URL: ${APP_API_BASE_URL}
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${FRONTEND_PORT}
      TLS_CERT_PATH: ${FRONTEND_TLS_CERT_PATH}
      TLS_KEY_PATH: ${FRONTEND_TLS_KEY_PATH}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS}
      APP_API_BASE_URL: ${APP_API_BASE_URL}
      NEXT_PUBLIC_BFF_API_BASE_URL: ${NEXT_PUBLIC_BFF_API_BASE_URL}
    volumes:
      - ./containers/infra/local-prod/certs/tls.crt:/etc/tracen/certs/tls.crt:ro
      - ./containers/infra/local-prod/certs/tls.key:/etc/tracen/certs/tls.key:ro
      - ./containers/infra/local-prod/certs/ca.crt:/etc/tracen/certs/ca.crt:ro
    depends_on:
      - backend
    networks:
      local-prod:
        aliases:
          - frontend.tracen.local

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - '443:443'
    volumes:
      - ./containers/infra/nginx/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./containers/infra/local-prod/certs/tls.crt:/etc/nginx/certs/tls.crt:ro
      - ./containers/infra/local-prod/certs/tls.key:/etc/nginx/certs/tls.key:ro
      - ./containers/infra/local-prod/certs/ca.crt:/etc/nginx/certs/ca.crt:ro
    networks:
      local-prod:
        aliases:
          - tracen.local

  # ── モニタリング基盤 ─────────────────────────────
  prometheus:
    image: prom/prometheus:v3.13.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./containers/infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./containers/infra/monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - local-prod

  grafana:
    image: grafana/grafana:13.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: https://tracen.local/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./containers/infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./containers/infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - local-prod

  alertmanager:
    image: prom/alertmanager:v0.28.0
    volumes:
      - ./containers/infra/monitoring/alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - ./containers/infra/monitoring/alertmanager/secret:/etc/alertmanager/secret:ro
    command:
      - '--config.file=/etc/alertmanager/config.yml'
    networks:
      - local-prod

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    networks:
      - local-prod

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - local-prod

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      - db
    networks:
      - local-prod

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - redis
    networks:
      - local-prod

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command:
      - '--nginx.scrape-uri=http://nginx:80/stub_status'
    depends_on:
      - nginx
    networks:
      - local-prod

networks:
  local-prod:

volumes:
  registry_data:
  postgres_data:
  redis_data:
  file_storage_data:
  prometheus_data:
  grafana_data:
