services:
  registry:
    image: registry:2
    ports:
      - '5000:5000'
    environment:
      REGISTRY_HTTP_ADDR: ${REGISTRY_HTTP_ADDR}
      REGISTRY_HTTP_TLS_CERTIFICATE: ${REGISTRY_HTTP_TLS_CERTIFICATE}
      REGISTRY_HTTP_TLS_KEY: ${REGISTRY_HTTP_TLS_KEY}
    volumes:
      - registry_data:/var/lib/registry
      - ./containers/infra/local-prod/certs/tls.crt:/etc/registry/tls/tls.crt:ro
      - ./containers/infra/local-prod/certs/tls.key:/etc/registry/tls/tls.key:ro

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./containers/infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      local-prod:
        aliases:
          - db

  redis:
    image: redis:8.8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping >/dev/null']
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      local-prod:
        aliases:
          - redis

  backend:
    image: registry.tracen.local:5000/tracen-backend:${TRACEN_IMAGE_TAG:-local}
    labels:
      analytics_source: 'true'
    build:
      context: .
      dockerfile: containers/apps/backend/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${BACKEND_PORT}
      TLS_CERT_PATH: ${BACKEND_TLS_CERT_PATH}
      TLS_KEY_PATH: ${BACKEND_TLS_KEY_PATH}
      DATABASE_URL: ${DATABASE_URL}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS}
      PEPPER: ${PEPPER}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN}
      FILE_STORAGE_BASE_DIR: ${FILE_STORAGE_BASE_DIR}
      JWT_ISSUER: ${JWT_ISSUER}
      MASTER_API_KEY_RATE_LIMIT: ${MASTER_API_KEY_RATE_LIMIT}
      MASTER_API_KEY: ${MASTER_API_KEY}
    volumes:
      - ./containers/infra/local-prod/certs/tls.crt:/etc/tracen/certs/tls.crt:ro
      - ./containers/infra/local-prod/certs/tls.key:/etc/tracen/certs/tls.key:ro
      - ./jwt-certs:/jwt-certs:ro
      - file_storage_data:${FILE_STORAGE_BASE_DIR:-/app/uploads}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      local-prod:
        aliases:
          - backend.tracen.local

  frontend:
    image: registry.tracen.local:5000/tracen-frontend-bff:${TRACEN_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: containers/apps/frontend-bff/Dockerfile
      args:
        NEXT_PUBLIC_BFF_API_BASE_URL: ${NEXT_PUBLIC_BFF_API_BASE_URL}
        APP_API_BASE_URL: ${APP_API_BASE_URL}
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${FRONTEND_PORT}
      TLS_CERT_PATH: ${FRONTEND_TLS_CERT_PATH}
      TLS_KEY_PATH: ${FRONTEND_TLS_KEY_PATH}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS}
      APP_API_BASE_URL: ${APP_API_BASE_URL}
      NEXT_PUBLIC_BFF_API_BASE_URL: ${NEXT_PUBLIC_BFF_API_BASE_URL}
      MASTER_API_KEY: ${MASTER_API_KEY}
    volumes:
      - ./containers/infra/local-prod/certs/tls.crt:/etc/tracen/certs/tls.crt:ro
      - ./containers/infra/local-prod/certs/tls.key:/etc/tracen/certs/tls.key:ro
      - ./containers/infra/local-prod/certs/ca.crt:/etc/tracen/certs/ca.crt:ro
    depends_on:
      - backend
    networks:
      local-prod:
        aliases:
          - frontend.tracen.local

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - '443:443'
    volumes:
      - ./containers/infra/nginx/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./containers/infra/local-prod/certs/tls.crt:/etc/nginx/certs/tls.crt:ro
      - ./containers/infra/local-prod/certs/tls.key:/etc/nginx/certs/tls.key:ro
      - ./containers/infra/local-prod/certs/ca.crt:/etc/nginx/certs/ca.crt:ro
    networks:
      local-prod:
        aliases:
          - tracen.local
          - api.tracen.local

  # ── モニタリング基盤 ─────────────────────────────
  prometheus:
    image: prom/prometheus:v3.13.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./containers/infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./containers/infra/monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - local-prod

  grafana:
    image: grafana/grafana:13.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: https://tracen.local/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./containers/infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./containers/infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - local-prod

  alertmanager:
    image: prom/alertmanager:v0.28.0
    volumes:
      - ./containers/infra/monitoring/alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - ./containers/infra/monitoring/alertmanager/secret:/etc/alertmanager/secret:ro
    command:
      - '--config.file=/etc/alertmanager/config.yml'
    networks:
      - local-prod

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    networks:
      - local-prod

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.57.0
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    command:
      - '--docker_only=true'
    networks:
      - local-prod

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      - db
    networks:
      - local-prod

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - redis
    networks:
      - local-prod

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command:
      - '--nginx.scrape-uri=http://nginx:80/stub_status'
    depends_on:
      - nginx
    networks:
      - local-prod

  # ── 可視化基盤 (ELK, security + TLS 有効, analytics profile) ─────────────
  # 全区間 HTTPS。ES/Logstash は外部公開せず、Kibana のみ Nginx 経由(kibana.tracen.local, 要ログイン)で公開する。
  # 各サービスは *.tracen.local のワイルドカード証明書を /certs にマウントして TLS 通信する。
  #   docker compose -f docker-compose.local-prod.yml --profile analytics up -d
  # ELK は非 root(uid 1000)で動くため、ホストの秘密鍵(600)を bind mount すると読めない。
  # ホストの uid や OS(macOS/Linux)による差をなくすため、root で volume に複製し所有者を揃える。
  elk-certs-init:
    image: alpine:3.20
    profiles: ['analytics']
    user: root
    volumes:
      - ./containers/infra/local-prod/certs:/src:ro
      - elk_certs:/dst
    command:
      - sh
      - -ec
      - |
        cp /src/tls.crt /src/tls.key /src/ca.crt /dst/
        chown -R 1000:0 /dst
        chmod 640 /dst/tls.key
        chmod 644 /dst/tls.crt /dst/ca.crt
    networks:
      - local-prod

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: ['analytics']
    env_file:
      - .env
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - elk_certs:/usr/share/elasticsearch/config/certs:ro
    depends_on:
      elk-certs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'curl -sk https://localhost:9200 >/dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 40
    networks:
      local-prod:
        aliases:
          - elasticsearch.tracen.local

  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: ['analytics']
    env_file:
      - .env
    volumes:
      - elk_certs:/certs:ro
    entrypoint: ['bash', '-c']
    command:
      - |
        until curl -s -o /dev/null --cacert /certs/ca.crt https://elasticsearch.tracen.local:9200; do sleep 2; done
        curl -fsS --cacert /certs/ca.crt -X POST -u "$${ELASTIC_USERNAME}:$${ELASTIC_PASSWORD}" https://elasticsearch.tracen.local:9200/_security/user/kibana_system/_password -H 'Content-Type: application/json' -d "{\"password\":\"$${KIBANA_SYSTEM_PASSWORD}\"}" >/dev/null # gitleaks:allow
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      local-prod:
        aliases:
          - es-setup

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: ['analytics']
    env_file:
      - .env
    volumes:
      - elk_certs:/certs:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-setup:
        condition: service_completed_successfully
    networks:
      local-prod:
        aliases:
          - kibana.tracen.local

  kibana-provision:
    image: curlimages/curl:8.11.1
    profiles: ['analytics']
    env_file:
      - .env
    volumes:
      - ./containers/infra/analytics/kibana-objects.ndjson:/objects.ndjson:ro
      - elk_certs:/certs:ro
    entrypoint: ['sh', '-ec']
    command:
      - |
        until curl -fsS -o /dev/null --cacert /certs/ca.crt https://kibana.tracen.local:5601/api/status; do sleep 3; done
        result=$$(curl -fsS --cacert /certs/ca.crt -u "$${ELASTIC_USERNAME}:$${ELASTIC_PASSWORD}" -X POST 'https://kibana.tracen.local:5601/api/saved_objects/_import?overwrite=true' -H 'kbn-xsrf: true' -F file=@/objects.ndjson) # gitleaks:allow
        echo "$$result"
        echo "$$result" | grep -q '"success":true'
    depends_on:
      - kibana
    networks:
      - local-prod

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    profiles: ['analytics']
    env_file:
      - .env
    volumes:
      - ./containers/infra/analytics/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./containers/infra/analytics/logstash/pipeline-local-prod:/usr/share/logstash/pipeline:ro
      - ./containers/infra/analytics/logstash/templates:/usr/share/logstash/templates:ro
      - elk_certs:/usr/share/logstash/config/certs:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      local-prod:
        aliases:
          - logstash.tracen.local

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    profiles: ['analytics']
    user: root
    command: ['filebeat', '-e', '--strict.perms=false']
    # filebeat.yml が ${LOGSTASH_SSL_ENABLED} 等を参照するため env_file が必須。
    # 無いと既定値(ssl.enabled=false)になり、TLS 待ち受けの Logstash に接続できない。
    env_file:
      - .env
    volumes:
      - ./containers/infra/analytics/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - elk_certs:/certs:ro
    depends_on:
      - logstash
    networks:
      local-prod:
        aliases:
          - filebeat

networks:
  local-prod:

volumes:
  registry_data:
  postgres_data:
  redis_data:
  file_storage_data:
  elasticsearch_data:
  elk_certs:
  prometheus_data:
  grafana_data:
