server {
  listen 80;
  server_name tracen.local;

  location = /stub_status {
    stub_status;
    access_log off;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name tracen.local;

  ssl_certificate /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;

  # デフォルトは1MBのため、画像アップロード(backendのFileSizeSchemaの上限である10MB)に合わせて引き上げる
  client_max_body_size 10m;

  # ▼▼ 追加：Docker DNS で実行時に解決（起動時 host not found を防ぐ）
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $frontend_upstream frontend.tracen.local;
  # ▲▲

  location /api/ {
    proxy_pass https://$frontend_upstream:3443;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
    proxy_ssl_verify_depth 2;
  }

  location / {
    proxy_pass https://$frontend_upstream:3443;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_cache_bypass $http_upgrade;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
    proxy_ssl_verify_depth 2;
  }

  set $grafana_upstream grafana:3000;

  location /grafana/ {
    proxy_pass http://$grafana_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
