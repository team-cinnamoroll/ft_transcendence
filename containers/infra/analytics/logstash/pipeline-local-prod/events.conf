# local-prod 用。filter は ../pipeline/events.conf と同期させること。
# dev と異なり beats input / ES output を TLS 化する。
input {
  beats {
    port => 5044
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/config/certs/tls.crt"
    ssl_key => "/usr/share/logstash/config/certs/tls.key"
  }
}

filter {
  json {
    source => "message"
  }
  if [category] not in ["auth", "face", "seed"] {
    drop {}
  }
  date {
    match => ["@timestamp", "ISO8601"]
  }
  mutate {
    remove_field => ["message", "@version", "agent", "ecs", "host", "input", "log", "tags", "stream", "container", "docker", "event", "cloud", "orchestrator", "level", "pid", "hostname", "msg"]
  }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch.tracen.local:9200"]
    user => "${LOGSTASH_ES_USER}"
    password => "${LOGSTASH_ES_PASSWORD}"
    cacert => "/usr/share/logstash/config/certs/ca.crt"
    manage_template => true
    template => "/usr/share/logstash/templates/events-template.json"
    template_name => "events"
    template_overwrite => true
    # ILM でログを日次 index に分割し、30日経過分を自動削除する(ポリシーは es-setup が登録)
    ilm_enabled => true
    ilm_rollover_alias => "events"
    ilm_pattern => "000001"
    ilm_policy => "events"
  }
}
